# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# omokage measured end to end with himorime (https://github.com/nao1215/himorime):
# the process a user starts, from its first instruction to its exit.
#
#   make bench          measure the working tree
#   make bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# The posts are generated by gen.sh before measuring: mixed Japanese and
# English paragraphs, as the Go benchmarks this suite replaced used. Both
# revisions run the working tree's gen.sh (${head_root}). Every benchmark
# keeps its store in its own directory (OMOKAGE_HOME).
version: "1"

suite:
  name: omokage
  description: Start-up, training on 5 and 50 posts, checking a draft in each output mode, diff, and the error path.

build:
  command: [go, build, -trimpath, -o, "${artifact}", .]
  cwd: ..

defaults:
  warmup: 2
  runs: 20
  cwd: "${workdir}"
  env:
    HOME: "${workdir}"
    XDG_CONFIG_HOME: "${workdir}/.config"
    OMOKAGE_HOME: "${workdir}/store"
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu:
      max_percent: 15
      min_difference: 2ms
    memory:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    description: Starting omokage and exiting.
    tags: [smoke]
    commands:
      omokage:
        command: ["${artifact}", version]

  - name: train 5 posts
    description: >-
      Learning a style from 5 posts of 8 paragraphs: extracting the features
      of each post (the Japanese analyzer loads its dictionary once per
      process) and aggregating them.
    tags: [smoke]
    setup:
      - command: ["${artifact}", init, --global]
      - command: [sh, "${head_root}/gen.sh", corpus, "5", "8", "${workdir}/posts"]
    commands:
      omokage:
        command: ["${artifact}", train, --author, me, posts]

  - name: train 50 posts
    description: Learning a style from 50 posts of 8 paragraphs, where extracting and aggregating the features of every post dominates.
    tags: [large]
    setup:
      - command: ["${artifact}", init, --global]
      - command: [sh, "${head_root}/gen.sh", corpus, "50", "8", "${workdir}/posts"]
    commands:
      omokage:
        command: ["${artifact}", train, --author, me, posts]

  - name: check 8 paragraphs
    description: >-
      Scoring a draft of 8 paragraphs against a profile trained on 50 posts,
      in each output mode: the top differences, --explain with the
      paragraphs that drift most, --format json, and --score-only.
    tags: [smoke]
    setup:
      - command: ["${artifact}", init, --global]
      - command: [sh, "${head_root}/gen.sh", corpus, "50", "8", "${workdir}/posts"]
      - command: ["${artifact}", train, --author, me, posts]
      - command: [sh, "${head_root}/gen.sh", doc, "8", "999", "${workdir}/draft.md"]
    baseline: default
    commands:
      default:
        command: ["${artifact}", check, --author, me, draft.md]
      explain:
        command: ["${artifact}", check, --author, me, --explain, draft.md]
      json:
        command: ["${artifact}", check, --author, me, --format, json, draft.md]
      score-only:
        command: ["${artifact}", check, --author, me, --score-only, draft.md]

  - name: check 400 paragraphs
    description: Scoring and explaining a draft of 400 paragraphs, where extracting its features dominates.
    tags: [large]
    setup:
      - command: ["${artifact}", init, --global]
      - command: [sh, "${head_root}/gen.sh", corpus, "50", "8", "${workdir}/posts"]
      - command: ["${artifact}", train, --author, me, posts]
      - command: [sh, "${head_root}/gen.sh", doc, "400", "999", "${workdir}/draft.md"]
    baseline: default
    metrics:
      throughput:
        work:
          file_size: "${workdir}/draft.md"
    commands:
      default:
        command: ["${artifact}", check, --author, me, draft.md]
      explain:
        command: ["${artifact}", check, --author, me, --explain, draft.md]

  - name: diff 8 paragraphs
    description: Comparing two posts directly, without a trained profile.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", doc, "8", "1", "${workdir}/a.md"]
      - command: [sh, "${head_root}/gen.sh", doc, "6", "2", "${workdir}/b.md"]
    commands:
      omokage:
        command: ["${artifact}", diff, a.md, b.md]

  - name: diff 400 paragraphs
    description: Comparing two posts of 400 and 300 paragraphs.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", doc, "400", "1", "${workdir}/a.md"]
      - command: [sh, "${head_root}/gen.sh", doc, "300", "2", "${workdir}/b.md"]
    commands:
      omokage:
        command: ["${artifact}", diff, a.md, b.md]

  - name: check error
    description: Checking a draft that does not exist, which fails with exit 1.
    tags: [smoke]
    setup:
      - command: ["${artifact}", init, --global]
      - command: [sh, "${head_root}/gen.sh", corpus, "5", "8", "${workdir}/posts"]
      - command: ["${artifact}", train, --author, me, posts]
    exit_codes: [1]
    commands:
      omokage:
        command: ["${artifact}", check, --author, me, missing.md]
