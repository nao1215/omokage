# generated by octocov init
coverage:
  if: true
  # coverage.out is the combined unit + atago-E2E profile produced by
  # `make coverage` (scripts/coverage.sh), so this threshold measures both the
  # Go unit tests and what a real omokage run exercises through the binary.
  acceptable: 85%
  exclude:
    - "**/main.go"
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
