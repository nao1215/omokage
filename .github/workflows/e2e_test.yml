name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # atago bootstraps in Go (e2e/runner), so the suite runs on every system
  # omokage is built for, Windows included, without a POSIX shell.
  atago:
    name: atago (binary e2e)

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Install atago
        uses: nao1215/setup-atago@5dca90fe652651408ccd1c2aee030767484482a9 # v0.1.5
        with:
          version: v0.26.3

      # The hermetic runner builds omokage and runs the atago suite in a
      # temp-backed HOME/profile-store sandbox, so local and CI execution are
      # identical. The specs under e2e/atago pin the binary contract through
      # atago's declarative state/exit-code/stream assertions.
      - name: Run atago end-to-end tests
        run: go run ./e2e/runner
