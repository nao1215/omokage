name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          check-latest: true

      - name: Install atago
        uses: nao1215/setup-atago@v0.1.1
        with:
          version: v0.21.0

      # Combines unit-test coverage with self-hosted E2E coverage (the atago
      # suite runs a `go build -cover` omokage and collects covdata via
      # GOCOVERDIR), then merges both into coverage.out.
      - name: Run combined unit + E2E coverage
        run: make coverage

      - uses: k1LoW/octocov-action@v1
        with:
          config: .octocov.yml
          work-dir: .
          args: --report=coverage.out
