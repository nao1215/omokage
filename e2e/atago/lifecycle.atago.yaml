# State transitions of a profile store: what `init`, `train`, `rename`, and
# `remove` create, modify, and delete on disk, and how `list`/`show` read it
# back. The filesystem side effects are pinned with `changes:` (content-based,
# exhaustive for the fields it sets) rather than described in prose, and
# `sandbox_home: true` routes HOME into the tracked workdir so an accidental
# write outside the project store would surface as an unexpected change.
# Run with: make test-e2e-atago
version: "1"

suite:
  name: omokage store lifecycle

scenarios:
  - name: init creates exactly the project store and touches nothing else
    steps:
      - run:
          sandbox_home: true
          command: omokage init
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Initialized omokage project."
              - "Config:"
              - "Profiles:"
              - "Cache:"
          # omokage.toml is the only file init writes; profiles/ and cache/ are
          # created empty. modified/deleted are empty, proving init neither
          # rewrites existing files nor pollutes the sandboxed HOME.
          changes:
            created:
              - omokage.toml
            modified: []
            deleted: []
      - assert:
          dir:
            path: profiles
            exists: true
      - assert:
          dir:
            path: cache
            exists: true

  - name: init refuses to overwrite an existing store
    steps:
      - run:
          command: omokage init
      - assert:
          exit_code: 0
      - run:
          command: omokage init
      - assert:
          exit_code: 1
          stderr:
            contains: "already exists"

  - name: train writes one profile database named for the author
    steps:
      - run:
          command: omokage init
      - assert:
          exit_code: 0
      - run:
          command: omokage train --author me "${env:OMOKAGE_EXAMPLES}/en/posts"
      - assert:
          exit_code: 0
          changes:
            created:
              - profiles/me.db
      - run:
          command: omokage list
      - assert:
          exit_code: 0
          stdout:
            equals: "me"

  - name: list --long reports provenance for each author
    steps:
      - run:
          command: omokage init
      - assert:
          exit_code: 0
      - run:
          command: omokage train --author blog "${env:OMOKAGE_EXAMPLES}/en/posts"
      - assert:
          exit_code: 0
      - run:
          command: omokage list --long
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "AUTHOR"
              - "FILES"
              - "blog"
      - run:
          command: omokage show --author blog
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Author: blog"
              - "Files: 8"
              - "Reliability: good"

  - name: rename moves the profile and the old name disappears
    steps:
      - run:
          command: omokage init
      - assert:
          exit_code: 0
      - run:
          command: omokage train --author me "${env:OMOKAGE_EXAMPLES}/en/posts"
      - assert:
          exit_code: 0
      - run:
          command: omokage rename --author me --to watashi
      - assert:
          exit_code: 0
          stdout:
            contains: 'Renamed author "me" to "watashi".'
          # The rename is a create+delete on disk, not a rewrite of me.db.
          changes:
            created:
              - profiles/watashi.db
            deleted:
              - profiles/me.db
      - run:
          command: omokage list
      - assert:
          exit_code: 0
          stdout:
            equals: "watashi"

  - name: remove deletes the profile database
    steps:
      - run:
          command: omokage init
      - assert:
          exit_code: 0
      - run:
          command: omokage train --author me "${env:OMOKAGE_EXAMPLES}/en/posts"
      - assert:
          exit_code: 0
      - run:
          command: omokage remove --author me
      - assert:
          exit_code: 0
          stdout:
            contains: 'Removed author "me".'
          changes:
            deleted:
              - profiles/me.db
      - run:
          command: omokage list
      - assert:
          exit_code: 0
          stdout:
            empty: true

  - name: init --global writes to the global store, not the local directory
    steps:
      # OMOKAGE_TEST_GLOBAL is a sandboxed global home outside the tracked
      # workdir (set by e2e/runner), so the store lands there. The local working
      # directory stays untouched — no omokage.toml here — which
      # `changes: created: []` verifies rather than assumes.
      - run:
          command: omokage init --global
          env:
            OMOKAGE_HOME: "${env:OMOKAGE_TEST_GLOBAL}"
      - assert:
          exit_code: 0
          stdout:
            contains: "Initialized omokage global store."
          changes:
            created: []
            modified: []
            deleted: []

  - name: "init --name records the project name in omokage.toml"
    steps:
      - run:
          command: omokage init --name my-style
      - assert:
          exit_code: 0
          stdout:
            contains: "Initialized omokage project."
      - assert:
          file:
            path: omokage.toml
            contains: my-style

  - name: "list prints every trained author"
    steps:
      - run:
          command: omokage init
      - assert:
          exit_code: 0
      - run:
          command: omokage train --author ja_me "${env:OMOKAGE_TESTDATA}/ja/posts"
      - assert:
          exit_code: 0
      - run:
          command: omokage train --author en_me "${env:OMOKAGE_TESTDATA}/en/posts"
      - assert:
          exit_code: 0
      - run:
          command: omokage list
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "ja_me"
              - "en_me"

  - name: "list --long shows the trained time and source columns"
    steps:
      - run:
          command: omokage init
      - assert:
          exit_code: 0
      - run:
          command: omokage train --author me "${env:OMOKAGE_TESTDATA}/ja/posts"
      - assert:
          exit_code: 0
      - run:
          command: omokage list --long
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "AUTHOR"
              - "TRAINED"
              - "SOURCE"
              - "me"

  - name: "remove fails for an author that does not exist"
    steps:
      - run:
          command: omokage init
      - assert:
          exit_code: 0
      - run:
          command: omokage remove --author ghost
      - assert:
          exit_code: 1
          stderr:
            contains: "profile not found"

  - name: "a renamed profile keeps its data under the new name"
    steps:
      - run:
          command: omokage init
      - assert:
          exit_code: 0
      - run:
          command: omokage train --author me "${env:OMOKAGE_TESTDATA}/ja/posts"
      - assert:
          exit_code: 0
      - run:
          command: omokage rename --author me --to watashi
      - assert:
          exit_code: 0
      - run:
          command: omokage show --author watashi
      - assert:
          exit_code: 0
          stdout:
            contains: "Author: watashi"

  - name: "rename refuses to overwrite an existing author"
    steps:
      - run:
          command: omokage init
      - assert:
          exit_code: 0
      - run:
          command: omokage train --author me "${env:OMOKAGE_TESTDATA}/ja/posts"
      - assert:
          exit_code: 0
      - run:
          command: omokage train --author other "${env:OMOKAGE_TESTDATA}/ja/posts"
      - assert:
          exit_code: 0
      - run:
          command: omokage rename --author me --to other
      - assert:
          exit_code: 1
          stderr:
            contains: "already exists"

  # OMOKAGE_HOME points at a per-scenario global store; with no local
  # omokage.toml a bare check falls back to it and auto-selects the profile.
  - name: "a global store is initialized and used with no local project"
    steps:
      - run:
          command: omokage init --global
          env:
            OMOKAGE_HOME: "${workdir}/home"
      - assert:
          exit_code: 0
      - run:
          command: omokage train --global --author me "${env:OMOKAGE_TESTDATA}/ja/posts"
          env:
            OMOKAGE_HOME: "${workdir}/home"
      - assert:
          exit_code: 0
      - run:
          command: omokage check "${env:OMOKAGE_TESTDATA}/ja/keep.md"
          env:
            OMOKAGE_HOME: "${workdir}/home"
      - assert:
          exit_code: 0
          stdout:
            contains: "Author: me"

  - name: "a local project takes precedence over the global store"
    steps:
      - run:
          command: omokage init --global
          env:
            OMOKAGE_HOME: "${workdir}/home"
      - assert:
          exit_code: 0
      - run:
          command: omokage train --global --author global_author "${env:OMOKAGE_TESTDATA}/ja/posts"
          env:
            OMOKAGE_HOME: "${workdir}/home"
      - assert:
          exit_code: 0
      - run:
          command: omokage init
          env:
            OMOKAGE_HOME: "${workdir}/home"
      - assert:
          exit_code: 0
      - run:
          command: omokage train --author local_author "${env:OMOKAGE_TESTDATA}/ja/posts"
          env:
            OMOKAGE_HOME: "${workdir}/home"
      - assert:
          exit_code: 0
      - run:
          command: omokage list
          env:
            OMOKAGE_HOME: "${workdir}/home"
      - assert:
          exit_code: 0
          stdout:
            contains: "local_author"
            not_contains: "global_author"
