# The `diff` contract: compare two files directly, with no init, training, or
# profile. Every scenario runs in a fresh workdir with no omokage.toml, which is
# itself the assertion that diff needs no store. The relations pinned are
# metamorphic: a file against itself is 100%, and the score is symmetric while
# the per-feature direction flips (higher <-> lower) when the two files swap
# roles. Run with: make test-e2e-atago
version: "1"

suite:
  name: omokage diff contract

scenarios:
  - name: a file compared against itself is 100% similar
    steps:
      - run:
          command: omokage diff "${env:OMOKAGE_EXAMPLES}/en/draft-keeps-voice.md" "${env:OMOKAGE_EXAMPLES}/en/draft-keeps-voice.md"
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Similarity: 100%"
              - "no significant stylistic drift detected"

  - name: the similarity score is symmetric under swapping the two files
    steps:
      - run:
          command: omokage diff "${env:OMOKAGE_EXAMPLES}/en/draft-keeps-voice.md" "${env:OMOKAGE_EXAMPLES}/en/draft-lost-voice.md"
      - assert:
          exit_code: 0
          stdout:
            # A is the reference here, so B's wider sentences read as "higher".
            contains:
              - "Similarity: 81%"
              - "sentence length variance is higher than reference"
      - run:
          command: omokage diff "${env:OMOKAGE_EXAMPLES}/en/draft-lost-voice.md" "${env:OMOKAGE_EXAMPLES}/en/draft-keeps-voice.md"
      - assert:
          exit_code: 0
          stdout:
            # Same score, but with the roles swapped the same feature now reads
            # "lower" — the direction is relative to whichever file is reference.
            contains:
              - "Similarity: 81%"
              - "sentence length variance is lower than reference"

  - name: diff names both files it compared
    steps:
      - run:
          command: omokage diff "${env:OMOKAGE_EXAMPLES}/en/draft-keeps-voice.md" "${env:OMOKAGE_EXAMPLES}/en/draft-lost-voice.md"
      - assert:
          exit_code: 0
          stdout:
            contains:
              - "Reference:"
              - "Target:"

  - name: "a Japanese file compared against itself is 100% similar"
    steps:
      - run:
          command: omokage diff "${env:OMOKAGE_TESTDATA}/ja/keep.md" "${env:OMOKAGE_TESTDATA}/ja/keep.md"
      - assert:
          exit_code: 0
          stdout:
            contains: "Similarity: 100%"

  - name: "a register change lowers the similarity below 100%"
    steps:
      - run:
          command: omokage diff "${env:OMOKAGE_TESTDATA}/ja/keep.md" "${env:OMOKAGE_TESTDATA}/ja/lost.md"
      # One or two digits: anything from 0% to 99%, i.e. below 100%.
      - assert:
          exit_code: 0
          stdout:
            matches: "Similarity: [0-9]{1,2}%"

  - name: "a missing operand file fails"
    steps:
      - run:
          command: omokage diff "${env:OMOKAGE_TESTDATA}/ja/keep.md" ja/missing.md
      - assert:
          exit_code: 1
          stderr:
            empty: false

  - name: "two empty files are diffed without crashing"
    steps:
      - fixture:
          file: a.md
          content: ""
      - fixture:
          file: b.md
          content: ""
      - run:
          command: omokage diff a.md b.md
      - assert:
          exit_code: 0
          stdout:
            contains: "Similarity:"
